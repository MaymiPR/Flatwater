<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img">
  <title>Flatwater</title>
  <!-- Transparent background; light lettering for dark pages (flatwater-banner-light.svg is the light-page twin) -->
  <defs>
    <linearGradient id="wg" x1="30" y1="0" x2="170" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#40d6f0"/><stop offset="1" stop-color="#ffaa1e"/>
    </linearGradient>
  </defs>
  <g transform="translate(0 30)">   <!-- 1280 x 420: the 360-high artwork, centred -->
    <g transform="translate(90 70) scale(1.1)">
      <rect width="200" height="200" rx="44" fill="#04121f" stroke="#1d3a52" stroke-width="3"/>
      <g transform="translate(0 -8)">   <!-- the mark: a sun on dead-calm water, its reflection in flat bars -->
      <path d="M58 104 A42 42 0 0 1 142 104 Z" fill="#ffaa1e"/>
      <line x1="30" y1="110" x2="170" y2="110" stroke="url(#wg)" stroke-width="8" stroke-linecap="round"/>
      <g stroke="#ffaa1e" stroke-linecap="round">
        <line x1="66" y1="126" x2="134" y2="126" stroke-width="7" opacity=".6"/>
        <line x1="80" y1="140" x2="120" y2="140" stroke-width="6" opacity=".35"/>
        <line x1="92" y1="152" x2="108" y2="152" stroke-width="5" opacity=".2"/>
      </g>
    </g>
    </g>
    <text x="370" y="190" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="108" font-weight="700" fill="#e8f1f7" letter-spacing="6">FLATWATER</text>
    <text x="372" y="248" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="42" font-weight="400" fill="#ffaa1e" letter-spacing="22">SUITE</text>
    <text x="372" y="300" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#8fb0c8">Open-source recreations of Waves mixing plug-ins, null-tested against the originals</text>
  </g>
</svg>
