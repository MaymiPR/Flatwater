<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img">
  <title>Flatwater</title>
  <!-- GitHub's social preview (1280 x 640): the banner recomposed on the icon's background; export: flatwater-social.png -->
  <defs>
    <linearGradient id="wg" x1="30" y1="0" x2="170" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#40d6f0"/><stop offset="1" stop-color="#ffaa1e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#04121f"/>
  <g transform="translate(100 160) scale(1.6)">
    <rect width="200" height="200" rx="44" fill="#04121f" stroke="#1d3a52" stroke-width="3"/>
    <g transform="translate(0 -8)">   <!-- the mark: a sun on dead-calm water, its reflection in flat bars -->
      <path d="M58 104 A42 42 0 0 1 142 104 Z" fill="#ffaa1e"/>
      <line x1="30" y1="110" x2="170" y2="110" stroke="url(#wg)" stroke-width="8" stroke-linecap="round"/>
      <g stroke="#ffaa1e" stroke-linecap="round">
        <line x1="66" y1="126" x2="134" y2="126" stroke-width="7" opacity=".6"/>
        <line x1="80" y1="140" x2="120" y2="140" stroke-width="6" opacity=".35"/>
        <line x1="92" y1="152" x2="108" y2="152" stroke-width="5" opacity=".2"/>
      </g>
    </g>
  </g>
  <text x="500" y="300" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="104" font-weight="700" fill="#e8f1f7" letter-spacing="6">FLATWATER</text>
  <text x="503" y="372" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="54" font-weight="400" fill="#ffaa1e" letter-spacing="28">SUITE</text>
  <text x="504" y="438" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" fill="#8fb0c8">Open-source recreations of Waves mixing plug-ins,</text>
  <text x="504" y="476" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="27" fill="#8fb0c8">null-tested against the originals.</text>
  <text x="640" y="590" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#5f8099">github.com/MaymiPR/Flatwater</text>
</svg>
